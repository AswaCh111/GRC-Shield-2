select option{background:var(--card);color:var(--text)}
.tbl{border-collapse:collapse}
.tbl th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:.7rem .9rem;border-bottom:1px solid var(--border);background:var(--card2)}
.tbl td{padding:.7rem .9rem;border-bottom:1px solid var(--border);font-size:.85rem;vertical-align:middle}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:rgba(34,211,238,.05)}
.progress-track{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;border-radius:99px;transition:width .5s ease}
.nav-item{display:flex;align-items:center;gap:.7rem;padding:.65rem .9rem;border-radius:11px;font-size:.875rem;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;border:1px solid transparent}
.nav-item:hover{color:var(--text);background:var(--card2)}

.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none}
.toast{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:12px;padding:.7rem 1rem;font-size:.85rem;font-weight:500;box-shadow:var(--shadow);animation:tin .25s ease}

.heat-cell{width:100%;aspect-ratio:1.6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;cursor:pointer;transition:transform .12s;border:1px solid rgba(255,255,255,.06)}

.modal-bg{background:rgba(3,7,18,.72);backdrop-filter:blur(4px)}
.modal-card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);animation:pop .18s ease;max-height:88vh;overflow-y:auto}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.stat-card{position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(34,211,238,.12),transparent 55%);pointer-events:none}

function xorEnc(s){const k='GRCSHIELD2026!';let o='';for(let i=0;i<s.length;i++)o+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));return btoa(unescape(encodeURIComponent(o)));}
function xorDec(b){try{const k='GRCSHIELD2026!';const s=decodeURIComponent(escape(atob(b)));let o='';for(let i=0;i<s.length;i++)o+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));return o;}catch(e){return null;}}
function secState(){try{const r=localStorage.getItem('grcshield_sec');return r?JSON.parse(xorDec(r)||'{}'):{};}catch(e){return{};}}
function secSave(s){try{localStorage.setItem('grcshield_sec',xorEnc(JSON.stringify(s)));}catch(e){}}
function secFail(email){const s=secState();s.fails=s.fails||{};s.fails[email]=(s.fails[email]||0)+1;secSave(s);return s.fails[email];}
function secReset(email){const s=secState();if(s.fails)delete s.fails[email];secSave(s);}
function secLock(email,secs){const s=secState();s.locks=s.locks||{};s.locks[email]=Date.now()+secs*1000;secSave(s);}
function secLocked(email){const l=(secState().locks||{})[email]||0;return Math.max(0,Math.ceil((l-Date.now())/1000));}
function recordLogin(email,ok){DB.loginHistory=DB.loginHistory||[];DB.loginHistory.unshift({email,ok,time:new Date().toLocaleString()});DB.loginHistory=DB.loginHistory.slice(0,100);}

function dbLoad(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(!raw){DB=seed();}
    else{
      const dec=xorDec(raw);
      if(dec){DB=JSON.parse(dec);}
      else{DB=JSON.parse(raw);} /* migrate older plaintext databases */
    }
  }catch(e){DB=seed();}
  DB.documents=DB.documents||[]; DB.loginHistory=DB.loginHistory||[];
  dbSave();
}
function dbSave(){ try{localStorage.setItem(DB_KEY,xorEnc(JSON.stringify(DB)));}catch(e){} }

/* ═════════ SESSION & RBAC ═════════ */
let session=null;
function loadSession(){ try{session=JSON.parse(localStorage.getItem(SESS_KEY));}catch(e){session=null;} }
function saveSession(){ session?localStorage.setItem(SESS_KEY,JSON.stringify(session)):localStorage.removeItem(SESS_KEY); }
function me(){ return DB.users.find(u=>u.id===(session&&session.uid)); }
function requireRole(roles){ if(roles.includes(me().role))return true; toast('Your role ('+me().role+') does not have permission for this action.','error'); return false; }
const canEdit=()=>me()&&me().role!=='Viewer';
function logAction(action){ DB.logs.unshift({user:me()?me().name:'System',action,time:new Date().toLocaleString()}); DB.logs=DB.logs.slice(0,80); }

/* ═════════ NOTIFICATIONS ═════════ */
const NICON={risk:'alert-triangle',incident:'siren',audit:'clipboard-check',policy:'file-check',compliance:'check-square'};
function notify(kind,title,body){ DB.notifs.unshift({id:uid('n'),icon:NICON[kind]||'bell',title,body,time:'just now',read:false}); DB.notifs=DB.notifs.slice(0,30); dbSave(); renderNotifBadge(); }
function renderNotifBadge(){ const b=$('#notif-count'); if(!b)return; const n=DB.notifs.filter(x=>!x.read).length; b.textContent=n; b.classList.toggle('hidden',n===0); }
function toggleNotifDrop(){ const d=$('#notif-drop'); if(!d)return; d.classList.toggle('hidden'); if(!d.classList.contains('hidden')){ d.innerHTML=DB.notifs.map(n=>`
  <div class="px-4 py-3 flex gap-3 border-b last:border-0 ${n.read?'opacity-55':''}" style="border-color:var(--border)">
    <i data-lucide="${n.icon}" class="w-4 h-4 text-cy shrink-0 mt-.5"></i>
    <div class="min-w-0"><b class="text-sm block">${esc(n.title)}</b><p class="text-xs muted">${esc(n.body)}</p><p class="text-[10px] muted mt-1">${esc(n.time)}</p></div></div>`).join('')||'<p class="p-4 text-sm muted">No notifications.</p>';
  d.innerHTML+=`<button class="w-full text-center text-xs py-2.5 text-cy font-semibold hover:bg-cyan-500/10" onclick="markAllRead()">Mark all as read</button>`;
  lucide.createIcons(); } }
function markAllRead(){ DB.notifs.forEach(n=>n.read=true); dbSave(); renderNotifBadge(); toggleNotifDrop(); toggleNotifDrop(); }
document.addEventListener('click',e=>{ const d=$('#notif-drop'); if(d&&!d.classList.contains('hidden')&&!e.target.closest('#notif-wrap')) d.classList.add('hidden'); });

/* ═════════ TOASTS & MODALS ═════════ */
function toast(msg,type){ const t=document.createElement('div'); t.className='toast'+(type==='error'?' err':type==='info'?' info':''); t.innerHTML=`<i data-lucide="${type==='error'?'alert-circle':type==='info'?'info':'check-circle'}" class="w-4 h-4 shrink-0 ${type==='error'?'text-red-400':type==='info'?'text-viol':'text-cy'}"></i><span>${esc(msg)}</span>`; $('#toasts').appendChild(t); lucide.createIcons(); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320);},3200); }
function openModal(title,body,onOk,okLabel){
  $('#modal-root').innerHTML=`<div class="fixed inset-0 z-[95] modal-bg flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
    <div class="modal-card w-full max-w-lg p-6">
      <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-extrabold">${title}</h3>
        <button class="btn btn-ghost btn-sm" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
      <div class="space-y-4">${body}</div>
      <div class="flex justify-end gap-2 mt-6">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn ${okLabel==='Delete'?'btn-danger':'btn-pri'}" id="modal-ok">${okLabel||'Save'}</button></div>
    </div></div>`;
  $('#modal-ok').onclick=()=>{ if(onOk&&onOk()===false)return; closeModal(); };
  lucide.createIcons();
}
function closeModal(){ $('#modal-root').innerHTML=''; }

function fillDemo(e,p){ authTab('login'); $('#li-email').value=e; $('#li-pass').value=p; toast('Demo credentials filled — press Sign In.','info'); }
function doLogin(){
  const email=$('#li-email').value.trim().toLowerCase(), pass=$('#li-pass').value;
  const left=secLocked(email);
  if(left>0){ toast('Account temporarily locked. Try again in '+left+'s.','error'); return; }
  const u=DB.users.find(x=>x.email.toLowerCase()===email);
  if(!u){ recordLogin(email,false); dbSave(); toast('No account found for that email.','error'); return; }
  if(u.pass!==hashPassword(pass)){
    recordLogin(email,false); dbSave();
    const f=secFail(email);
    if(f>=5){ secLock(email,30); toast('Too many failed attempts — account locked for 30 seconds.','error'); }
    else toast('Incorrect password. '+(5-f)+' attempt(s) remaining.','error');
    return;
  }
  if(!u.active){ recordLogin(email,false); dbSave(); toast('This account has been deactivated. Contact an Admin.','error'); return; }
  secReset(email); recordLogin(email,true); dbSave();
  const btn=$('#li-btn'); btn.disabled=true;
  btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Authenticating…</span>'; lucide.createIcons();
  setTimeout(()=>{ session={uid:u.id,started:Date.now()}; saveSession(); logAction('Signed in'); dbSave(); toast('Welcome back, '+u.name.split(' ')[0]+'.'); renderApp(); go('dashboard'); },500);
}
function rgStrength(){
  const p=$('#rg-pass').value, box=$('#rg-strength'); if(!box)return;
  box.classList.toggle('hidden',!p);
  const s=pwScore(p), colors=['#f87171','#f87171','#fb923c','#fbbf24','#34d399','#22d3ee'];
  const bar=$('#rg-bar'); if(bar){bar.style.width=(s*20)+'%';bar.style.background=colors[s];}
  const lbl=$('#rg-lbl'); if(lbl){lbl.textContent=pwLabel(s)+' password';lbl.style.color=colors[s];}
}
function doRegister(){
  const name=$('#rg-name').value.trim(), email=$('#rg-email').value.trim().toLowerCase(), p1=$('#rg-pass').value, p2=$('#rg-pass2').value;
  if(!name||!email){ toast('Name and email are required.','error'); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Enter a valid email address.','error'); return; }
  if(p1.length<8){ toast('Password must be at least 8 characters.','error'); return; }
  if(pwScore(p1)<3){ toast('Password too weak — use 12+ chars with mixed case, numbers or symbols.','error'); return; }
  if(p1!==p2){ toast('Passwords do not match.','error'); return; }
  if(DB.users.find(x=>x.email.toLowerCase()===email)){ toast('An account with this email already exists.','error'); return; }
  DB.users.push({id:uid('u'),name,email,pass:hashPassword(p1),title:'Viewer',role:'Viewer',active:true,created:today()});
  logAction('Registered new account '+email); dbSave(); toast('Account created — please sign in.','info'); authTab('login'); $('#li-email').value=email;
}
function doForgot(){
  const email=$('#fp-email').value.trim().toLowerCase();
  if(!DB.users.find(x=>x.email.toLowerCase()===email)){ toast('No account found for that email.','error'); return; }
  toast('Password reset link sent to '+email+' (simulated in demo).','info');
}
function logout(){ logAction('Signed out'); dbSave(); session=null; saveSession(); renderLogin(); toast('Signed out.','info'); }

/* ═════════ RISK MANAGEMENT ═════════ */
let riskFilter={q:'',level:'',status:''};
function renderRisks(){
  const lvls=['Low','Medium','High','Critical'];
  const st=['Identified','Assessing','Mitigating','Monitoring','Resolved'];
  $('#view').innerHTML=`<div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <div><h1 class="text-2xl font-extrabold">Risk Management</h1><p class="muted text-sm">Identify → Assess (Likelihood × Impact) → Treat → Monitor. Score & severity auto-calculated.</p></div>
    ${canEdit()?`<button class="btn btn-pri" onclick="riskForm()"><i data-lucide="plus" class="w-4 h-4"></i>Add New Risk</button>`:''}</div>
  <div class="grid lg:grid-cols-3 gap-4 mb-5">
    <div class="card p-5 lg:col-span-1"><h3 class="font-bold mb-1 flex items-center gap-2"><i data-lucide="grid-3x3" class="w-4 h-4 text-cy"></i>5×5 Risk Heatmap</h3><p class="text-xs muted mb-4">Likelihood × Impact · click a cell to filter</p>
      <div class="grid gap-1" style="grid-template-columns:auto repeat(5,1fr)">
        <div></div>${[1,2,3,4,5].map(i=>`<div class="text-center text-[10px] muted font-bold">I${i}</div>`).join('')}
        ${[5,4,3,2,1].map(l=>`<div class="flex items-center"><span class="text-[10px] muted font-bold pr-1">L${l}</span></div>
          ${[1,2,3,4,5].map(i=>{const lv=riskLevel(l*i);const n=DB.risks.filter(r=>r.l===l&&r.i===i).length;
            return `<div class="heat-cell" style="background:${LEVEL_COLOR[lv]}22;color:${LEVEL_COLOR[lv]};border-color:${LEVEL_COLOR[lv]}44" title="${n} risk(s) at L${l}×I${i} (${lv})" onclick="riskHeatFilter('${lv}')">${n||''}</div>`;}).join('')}`).join('')}
      </div>
      <div class="flex gap-3 mt-3 justify-center">${lvls.map(l=>`<span class="flex items-center gap-1 text-[10px] muted"><span class="w-2.5 h-2.5 rounded-sm" style="background:${LEVEL_COLOR[l]}"></span>${l}</span>`).join('')}</div></div>
    <div class="card p-5 lg:col-span-2"><h3 class="font-bold mb-1 flex items-center gap-2"><i data-lucide="bar-chart-2" class="w-4 h-4 text-viol"></i>Risk Register</h3><p class="text-xs muted mb-4">${DB.risks.length} identified risks · ${DB.risks.filter(r=>r.status==='Resolved').length} resolved</p>
      <div class="flex flex-wrap gap-3 mb-4 items-end">
        <div class="flex-1 min-w-[11rem]"><label>Search</label><input id="rk-q" placeholder="Title, ID, owner…" value="${esc(riskFilter.q)}" oninput="riskFilter.q=this.value;renderRiskTable()"></div>
        <div><label>Severity</label><select id="rk-level" onchange="riskFilter.level=this.value;renderRiskTable()">
          <option value="">All</option>${lvls.map(l=>`<option ${riskFilter.level===l?'selected':''}>${l}</option>`).join('')}</select></div>
        <div><label>Status</label><select id="rk-status" onchange="riskFilter.status=this.value;renderRiskTable()">
          <option value="">All</option>${st.map(s=>`<option ${riskFilter.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="overflow-x-auto max-h-[28rem] overflow-y-auto"><table class="tbl w-full min-w-[820px]">
        <thead class="sticky top-0"><tr><th>ID</th><th>Risk</th><th>Category</th><th>L×I</th><th>Score</th><th>Severity</th><th>Owner</th><th>Status</th><th class="text-right">Actions</th></tr></thead>
        <tbody id="risk-rows"></tbody></table></div></div></div>
  <div class="card p-5"><h3 class="font-bold mb-3 flex items-center gap-2"><i data-lucide="target" class="w-4 h-4 text-cy"></i>Risk Treatment Pipeline</h3>
    <div class="grid md:grid-cols-5 gap-3">${st.map(s=>{const n=DB.risks.filter(r=>r.status===s);return `<div class="p-3 rounded-xl border" style="border-color:var(--border);background:var(--card2)">
      <p class="text-[11px] muted uppercase tracking-wide">${s}</p><p class="text-xl font-black mt-1">${n.length}</p>
      <p class="text-[10px] muted truncate">${n.slice(0,2).map(r=>r.title).join(' · ')||'—'}</p></div>`;}).join('')}</div></div>`;
  renderRiskTable(); lucide.createIcons();
}
function riskHeatFilter(lv){ riskFilter.level=riskFilter.level===lv?'':lv; renderRisks(); }
function filteredRisks(){ const q=riskFilter.q.toLowerCase();
  return DB.risks.filter(r=>(!q||r.title.toLowerCase().includes(q)||r.id.toLowerCase().includes(q)||r.owner.toLowerCase().includes(q))
    &&(!riskFilter.level||r.level===riskFilter.level)&&(!riskFilter.status||r.status===riskFilter.status)); }
function renderRiskTable(){
  const rows=filteredRisks();
  $('#risk-rows').innerHTML=rows.map(r=>`<tr>
    <td class="mono text-xs">${r.id}</td>
    <td><b class="text-sm">${esc(r.title)}</b><p class="text-[11px] muted max-w-[20rem] truncate">${esc(r.desc)}</p></td>
    <td class="text-xs">${esc(r.cat)}</td>
    <td class="text-xs mono">${r.l}×${r.i}</td>
    <td class="font-black" style="color:${LEVEL_COLOR[r.level]}">${r.score}</td>
    <td><span class="badge" style="background:${LEVEL_COLOR[r.level]}1c;color:${LEVEL_COLOR[r.level]};border:1px solid ${LEVEL_COLOR[r.level]}44">${r.level}</span></td>
    <td class="text-xs">${esc(r.owner)}</td>
    <td class="text-xs">${esc(r.status)}</td>
    <td class="text-right whitespace-nowrap">
      <button class="btn btn-ghost btn-sm" title="Details" onclick="riskView('${r.id}')"><i data-lucide="eye" class="w-3.5 h-3.5"></i></button>
      ${canEdit()?`<button class="btn btn-ghost btn-sm" title="Edit" onclick="riskForm('${r.id}')"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
      <button class="btn btn-danger btn-sm" title="Delete" onclick="riskDel('${r.id}')"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>`:''}
    </td></tr>`).join('')||'<tr><td colspan="9" class="text-center muted py-8">No risks match the current filters.</td></tr>';
  lucide.createIcons();
}
function riskView(id){ const r=DB.risks.find(x=>x.id===id); if(!r)return;
  openModal('Risk · '+r.id,`<div class="p-4 rounded-xl border" style="border-color:var(--border);background:var(--card2)">
    <div class="flex items-center gap-2 mb-2"><h4 class="font-extrabold">${esc(r.title)}</h4><span class="badge" style="background:${LEVEL_COLOR[r.level]}1c;color:${LEVEL_COLOR[r.level]};border:1px solid ${LEVEL_COLOR[r.level]}44">${r.level} · ${r.score}</span></div>
    <p class="text-sm muted mb-3">${esc(r.desc)}</p>
    <div class="grid grid-cols-2 gap-2 text-xs mb-3">
      <p><span class="muted">Category:</span> <b>${esc(r.cat)}</b></p><p><span class="muted">Owner:</span> <b>${esc(r.owner)}</b></p>
      <p><span class="muted">Likelihood:</span> <b>${r.l}/5</b></p><p><span class="muted">Impact:</span> <b>${r.i}/5</b></p>
      <p><span class="muted">Status:</span> <b>${esc(r.status)}</b></p><p><span class="muted">Identified:</span> <b>${fmtD(r.created)}</b></p></div>
    <p class="text-xs"><span class="muted">Mitigation plan:</span> ${esc(r.plan)}</p></div>`,null,'Close'); }
function riskForm(id){
  if(!canEdit()){ toast('Viewers cannot edit risks.','error'); return; }
  const r=id?DB.risks.find(x=>x.id===id):null;
  const cats=[...new Set(DB.risks.map(x=>x.cat))];
  openModal(r?'Edit Risk':'Add New Risk',`
    <div><label>Risk title *</label><input id="rf-title" value="${r?esc(r.title):''}" placeholder="e.g. Phishing Attack"></div>
    <div><label>Description *</label><textarea id="rf-desc" rows="2">${r?esc(r.desc):''}</textarea></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label>Category</label><select id="rf-cat">${cats.map(c=>`<option ${r&&r.cat===c?'selected':''}>${c}</option>`).join('')}<option ${r&&!cats.includes(r.cat)?'selected':''}>Other</option></select></div>
      <div><label>Owner *</label><input id="rf-owner" value="${r?esc(r.owner):esc(me().name)}"></div></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label>Likelihood (1–5)</label><input id="rf-l" type="number" min="1" max="5" value="${r?r.l:3}" oninput="riskLiveScore()"></div>
      <div><label>Impact (1–5)</label><input id="rf-i" type="number" min="1" max="5" value="${r?r.i:3}" oninput="riskLiveScore()"></div></div>
    <div class="p-3 rounded-xl border text-sm flex items-center gap-2" style="border-color:var(--border);background:var(--card2)">
      <span class="text-xs muted">Score = L × I →</span><b id="rf-score" class="text-lg"></b></div>
    <div><label>Mitigation plan</label><textarea id="rf-plan" rows="2">${r?esc(r.plan):''}</textarea></div>
    <div><label>Status</label><select id="rf-status">${['Identified','Assessing','Mitigating','Monitoring','Resolved'].map(s=>`<option ${r&&r.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`,()=>{
    const title=$('#rf-title').value.trim(), desc=$('#rf-desc').value.trim(), owner=$('#rf-owner').value.trim();
    const l=Math.min(5,Math.max(1,parseInt($('#rf-l').value)||1)), i=Math.min(5,Math.max(1,parseInt($('#rf-i').value)||1));
    if(!title||!desc||!owner){ toast('Title, description and owner are required.','error'); return false; }
    const {score,level}=calcRisk(l,i);
    if(r){ Object.assign(r,{title,desc,cat:$('#rf-cat').value,owner,l,i,score,level,plan:$('#rf-plan').value.trim(),status:$('#rf-status').value}); logAction('Edited risk '+r.id); toast('Risk updated.'); }
    else{ DB.risks.unshift({id:uid('RSK'),title,desc,cat:$('#rf-cat').value,owner,l,i,score,level,plan:$('#rf-plan').value.trim(),status:$('#rf-status').value,created:today()}); logAction('Created risk "'+title+'"'); toast('Risk added — score '+score+' ('+level+').'); }
    if(level==='Critical') notify('risk','Critical risk alert','"'+title+'" scored '+score+' (Critical). Immediate review recommended.');
    dbSave(); renderRisks(); });
  riskLiveScore();
}
function riskLiveScore(){ const l=parseInt($('#rf-l').value)||1,i=parseInt($('#rf-i').value)||1; const {score,level}=calcRisk(Math.min(5,Math.max(1,l)),Math.min(5,Math.max(1,i)));
  const el=$('#rf-score'); if(el){ el.textContent=score+' · '+level; el.style.color=LEVEL_COLOR[level]; } }
function riskDel(id){ if(!requireRole(['Admin','Security Officer']))return; const r=DB.risks.find(x=>x.id===id);
  confirmDlg('Delete risk "'+r.title+'"?',()=>{ DB.risks=DB.risks.filter(x=>x.id!==id); dbSave(); logAction('Deleted risk '+id); toast('Risk deleted.','info'); renderRisks(); }); }

/* ═════════ COMPLIANCE MANAGEMENT ═════════ */
let compOpen=null;
function renderCompliance(){
  compOpen=compOpen||DB.frameworks[0].id;
  $('#view').innerHTML=`<div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <div><h1 class="text-2xl font-extrabold">Compliance Management</h1><p class="muted text-sm">Framework assessments are <b>demonstrations</b> — not official certifications or legal compliance determinations.</p></div></div>
  <div class="grid md:grid-cols-3 gap-3 mb-5">
    ${DB.frameworks.map(f=>{const p=compPctOf(f),s=compStatus(p);return `<div class="card stat-card p-4 cursor-pointer ${compOpen===f.id?'ring-2 ring-cyan-500/50':''}" onclick="compOpen='${f.id}';renderCompliance()">
      <div class="flex items-start justify-between"><div><b class="text-sm">${f.name}</b><p class="text-[11px] muted mt-1">${f.reqs.filter(r=>r.done).length}/${f.reqs.length} requirements complete</p></div>
      <span class="badge" style="background:${COMP_COLOR[s]}1c;color:${COMP_COLOR[s]};border:1px solid ${COMP_COLOR[s]}44">${s}</span></div>

  </div>
  <div id="comp-detail"></div>`;
  renderCompDetail(); lucide.createIcons();
}
function renderCompDetail(){
  const f=DB.frameworks.find(x=>x.id===compOpen); if(!f)return;
  const p=compPctOf(f), s=compStatus(p);
  $('#comp-detail').innerHTML=`<div class="card overflow-hidden">
    <div class="p-5 border-b" style="border-color:var(--border);background:var(--card2)">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div><h3 class="font-extrabold">${f.name}</h3><p class="text-sm muted max-w-2xl mt-1">${esc(f.desc)}</p></div>
        <div class="flex items-center gap-3">
          <div class="text-right"><p class="text-2xl font-black" style="color:${COMP_COLOR[s]}">${p}%</p><p class="text-[10px] muted">Assessed ${fmtD(f.assessDate)}</p></div>
          <span class="badge" style="background:${COMP_COLOR[s]}1c;color:${COMP_COLOR[s]};border:1px solid ${COMP_COLOR[s]}44">${s}</span></div></div>
      <div class="progress-track mt-3"><div class="progress-fill" style="width:${p}%;background:${COMP_COLOR[s]}"></div></div></div>
    <div class="p-5 grid lg:grid-cols-3 gap-5">
      <div class="lg:col-span-2"><h4 class="font-bold mb-3 text-sm flex items-center gap-2"><i data-lucide="list-checks" class="w-4 h-4 text-cy"></i>Compliance Checklist</h4>
        <div class="space-y-2">${f.reqs.map((r,idx)=>`
          <label class="flex items-start gap-3 p-3 rounded-xl border cursor-pointer transition ${r.done?'bg-emerald-500/5':''}" style="border-color:${r.done?'rgba(52,211,153,.35)':'var(--border)'}" ${canEdit()?'':'onclick="return false"'}>
            <input type="checkbox" class="!w-4 !h-4 mt-.5 accent-emerald-500 shrink-0" ${r.done?'checked':''} ${canEdit()?'':'disabled'} onchange="compToggle('${f.id}',${idx},this.checked)">
            <span class="min-w-0"><b class="text-xs mono">${r.id}</b><p class="text-sm ${r.done?'':'muted'}">${esc(r.text)}</p></span>
            <span class="ml-auto badge ${r.done?'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30':'bg-red-500/10 text-red-400 border border-red-500/30'}">${r.done?'Complete':'Missing'}</span></label>`).join('')}</div></div>
      <div><h4 class="font-bold mb-3 text-sm flex items-center gap-2"><i data-lucide="paperclip" class="w-4 h-4 text-viol"></i>Evidence (${f.evidence.length})</h4>
        <div class="space-y-2 mb-4">${f.evidence.map((e,idx)=>`<div class="flex items-center gap-2 p-2.5 rounded-lg border text-xs" style="border-color:var(--border);background:var(--card2)">
          <i data-lucide="file-text" class="w-3.5 h-3.5 text-cy shrink-0"></i><span class="truncate flex-1">${esc(e.name)}</span>
          ${canEdit()?`<button class="btn btn-danger btn-sm" onclick="compDelEvidence('${f.id}',${idx})"><i data-lucide="x" class="w-3 h-3"></i></button>`:''}</div>`).join('')||'<p class="text-xs muted">No evidence uploaded yet.</p>'}</div>
        ${canEdit()?`<label class="btn btn-ghost w-full justify-center cursor-pointer"><i data-lucide="upload" class="w-4 h-4"></i>Upload evidence<input type="file" class="hidden" multiple onchange="compUpload('${f.id}',this)"></label>
        <button class="btn btn-pri w-full justify-center mt-2" onclick="compReassess('${f.id}')"><i data-lucide="refresh-cw" class="w-4 h-4"></i>Mark reassessed today</button>`:''}
        <div class="p-3 rounded-xl border mt-4 text-xs" style="border-color:var(--border);background:var(--card2)">
          <p class="font-bold mb-1">Requirement summary</p>
          <p class="text-emerald-400">✔ ${f.reqs.filter(r=>r.done).length} completed</p>
          <p class="text-red-400">✖ ${f.reqs.filter(r=>!r.done).length} missing</p></div></div>
    </div></div>`;
  lucide.createIcons();
}
function compToggle(fid,idx,done){
  if(!requireRole(['Admin','Security Officer'])){ renderCompDetail(); return; }
  const f=DB.frameworks.find(x=>x.id===fid); f.reqs[idx].done=done; f.assessDate=today();
  logAction((done?'Completed':'Reopened')+' requirement '+f.reqs[idx].id+' ('+f.name+')');
  const p=compPctOf(f);
  if(p>=90) notify('compliance',f.name+' now Compliant','All critical requirements satisfied ('+p+'%).');
  dbSave(); renderCompliance();
}
function compUpload(fid,input){
  if(!requireRole(['Admin','Security Officer']))return;
  const f=DB.frameworks.find(x=>x.id===fid);
  [...input.files].forEach(file=>{ if(file.size>2*1024*1024){ toast('"' +file.name+'" exceeds the 2MB demo limit — metadata recorded only.','info'); }
    f.evidence.push({name:file.name,size:file.size,uploaded:today(),by:me().name}); });
  logAction('Uploaded '+input.files.length+' evidence file(s) to '+f.name); dbSave(); renderCompliance(); toast('Evidence recorded.');
}
function compDelEvidence(fid,idx){ if(!requireRole(['Admin','Security Officer']))return; const f=DB.frameworks.find(x=>x.id===fid); f.evidence.splice(idx,1); dbSave(); renderCompliance(); toast('Evidence removed.','info'); }
function compReassess(fid){ if(!requireRole(['Admin','Security Officer']))return; const f=DB.frameworks.find(x=>x.id===fid); f.assessDate=today(); logAction('Reassessed '+f.name); dbSave(); renderCompliance(); toast(f.name+' reassessment date updated.'); }

}
function auditDel(id){ if(!requireRole(['Admin','Security Officer']))return; const a=DB.audits.find(x=>x.id===id);

function incForm(id){
  if(!canEdit()){ toast('Viewers cannot manage incidents.','error'); return; }

    <div><label>Status</label><select id="if-status">${['Reported','Investigating','Contained','Resolved'].map(s=>`<option ${i&&i.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`,()=>{
    const title=$('#if-title').value.trim(), desc=$('#if-desc').value.trim(), officer=$('#if-officer').value.trim(), date=$('#if-date').value;
    if(!title||!desc||!officer||!date){ toast('Title, description, officer and date are required.','error'); return false; }
    const data={title,cls:$('#if-cls').value,sev:$('#if-sev').value,desc,date,officer,actions:$('#if-actions').value.trim(),notes:$('#if-notes').value.trim(),status:$('#if-status').value};
    if(i){ const was=i.status; Object.assign(i,data);
      if(i.status==='Resolved'&&was!=='Resolved'){ i.resolvedDate=today(); i.timeline.push({t:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),x:'Marked as Resolved by '+me().name}); }
      logAction('Updated incident '+i.id); toast('Incident updated.'); }

let reportType='risk';

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">${['Critical','High','Medium','Low'].map(s=>`<div class="p-3 rounded-xl border" style="border-color:var(--border)"><p class="text-xs muted">${s}</p><p class="text-2xl font-extrabold">${rows.filter(i=>i.sev===s).length}</p></div>`).join('')}</div>

  } else if(reportType==='docs'){

    tableRows=rows.map(d=>[d.id,d.name,d.cls,d.src,fmtD(d.date),d.by,(d.text||'').slice(0,120)]);

function exportPDF(){

    doc.text('GRC SHIELD — CyberTech Solutions — '+doc.splitTextToSize(el.querySelector('h2')?.textContent||'Report',700)[0],40,45);

    const table=el.querySelector('table'); let y=82;
    if(table){ const rows=[...table.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>td.textContent.trim()));
      rows.forEach((row,ri)=>{ if(y>540){doc.addPage();y=60;}
        doc.setFontSize(7.5); doc.setTextColor(ri===0?8:60,ri===0?145:60,ri===0?178:60);
        doc.text(doc.splitTextToSize(row.join('   |   '),720)[0],40,y); y+=ri===0?18:14; }); }
    else { doc.setFontSize(10); doc.text(doc.splitTextToSize(el.innerText.replace(/\s+/g,' ').slice(0,3000),700),40,y); }

function scanPick(inp){ if(!inp.files||!inp.files[0])return; scanFile(inp.files[0]); }
function scanDrop(e){ e.preventDefault(); e.stopPropagation(); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f)scanFile(f); }
function scanFile(f){
  if(!f.type.startsWith('image/')){ toast('Please choose an image file (JPG/PNG/WEBP).','error'); return; }
  scanState={file:f,img:null,text:'',parsed:null};
  const r=new FileReader();
  r.onload=ev=>{ $('#scan-img').src=ev.target.result; $('#scan-preview').classList.remove('hidden'); $('#scan-bar').style.width='0%';
    $('#scan-status').textContent='Ready — "'+f.name+'" ('+Math.round(f.size/1024)+' KB). Run the scan.';
    scanState.img=ev.target.result; const pb=$('#parse-btn'); if(pb)pb.disabled=true; lucide.createIcons(); };
  r.readAsDataURL(f);
}
async function runScan(){
  if(!scanState.img){ toast('Select a document image first.','error'); return; }
  const btn=$('#scan-run'); btn.disabled=true;
  try{
    if(typeof Tesseract==='undefined'){ toast('OCR engine still loading — please retry in a moment.','info'); btn.disabled=false; return; }
    $('#scan-status').textContent='Loading OCR engine (first run downloads language data)…';
    const res=await Tesseract.recognize(scanState.img,'eng',{logger:m=>{ if(m.status==='recognizing text'){ $('#scan-bar').style.width=Math.round(m.progress*100)+'%'; $('#scan-status').textContent='Scanning… '+Math.round(m.progress*100)+'%'; } }});
    const txt=(res.data.text||'').trim();
    scanState.text=txt; $('#scan-text').value=txt;
    $('#scan-status').textContent='Scan complete — '+(txt?txt.split(/\s+/).length+' words extracted.':'no readable text found. Try a clearer, higher-resolution image.');
    const pb=$('#parse-btn'); if(pb)pb.disabled=!txt;
    if(txt){ logAction('Scanned document "'+scanState.file.name+'"'); dbSave(); toast('Scan complete — text extracted.'); }
  }catch(e){ toast('Scan failed: '+((e&&e.message)||e),'error'); }
  btn.disabled=false; lucide.createIcons();
}
function normalizeDocDate(d){ if(!d)return today(); if(d.indexOf('/')>-1){const p=d.split('/');return p[2]+'-'+p[1]+'-'+p[0];} return d; }
function smartParse(){
  const txt=$('#scan-text').value; if(!txt.trim()){ toast('No text to parse.','error'); return; }
  const low=txt.toLowerCase();
  const title=(txt.split('\n').find(l=>l.trim())||'Scanned Document').trim().slice(0,80);
  let sev=(low.match(/\b(critical|high|medium|low)\b/)||[])[1]; if(sev)sev=sev[0].toUpperCase()+sev.slice(1);
  const nums=txt.match(/\b[1-5]\b/g)||[];
  const dates=txt.match(/\d{4}-\d{2}-\d{2}|\d{2}\/\d{2}\/\d{4}/g)||[];
  const firstName=(me().name.split(' ')[0]||'').toLowerCase();
  const owner=(DB.users.find(u=>low.indexOf(u.name.toLowerCase().split(' ')[0])>-1&&u.name.split(' ')[0].toLowerCase()!==firstName)||me()).name;
  const cat=/phish|ransom|malware|breach|cloud|insider|ddos/.test(low)?'Cyber':'Operational';
  scanState.parsed={title:title,sev:['Critical','High','Medium','Low'].indexOf(sev)>-1?sev:'Medium',l:parseInt(nums[0])||3,i:parseInt(nums[1])||3,date:normalizeDocDate(dates[0]),owner:owner,cat:cat,raw:txt};
  const p=scanState.parsed;
  $('#parsed-box').classList.remove('hidden');
  $('#parsed-box').innerHTML=`<div class="p-4 rounded-xl border" style="border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.07)">
    <p class="text-xs font-bold uppercase tracking-wide text-viol mb-3 flex items-center gap-2"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i>Auto-detected fields — review before creating</p>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-x-4 gap-y-2 text-xs">
      ${[['Title',p.title],['Severity',p.sev],['Likelihood',p.l+'/5'],['Impact',p.i+'/5'],['Date',p.date],['Owner',p.owner],['Category',p.cat],['Words',txt.split(/\s+/).length]].map(([k,v])=>`<p><span class="muted">${k}:</span> <b>${esc(v)}</b></p>`).join('')}</div></div>`;
  $('#create-box').classList.remove('hidden');
  $('#cr-fields').innerHTML=`
    <div><label>Record title</label><input id="cd-title" value="${esc(p.title)}"></div>
    <div><label>Owner / Officer</label><input id="cd-owner" value="${esc(p.owner)}"></div>
    <div><label>Date</label><input id="cd-date" type="date" value="${p.date}"></div>
    <div><label>Vault classification</label><select id="cd-cls">${['Confidential','Internal','Public'].map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="sm:col-span-2"><label>Description (from document)</label><textarea id="cd-desc" rows="3">${esc(txt.slice(0,600))}</textarea></div>`;
  lucide.createIcons();
}
function createFromDoc(kind){
  if(!requireRole(['Admin','Security Officer']))return;
  const t=$('#cd-title').value.trim(), owner=$('#cd-owner').value.trim(), date=$('#cd-date').value, desc=$('#cd-desc').value.trim(), cls=$('#cd-cls').value;
  if(!t||!owner||!date||!desc){ toast('All fields are required.','error'); return; }
  const p=scanState.parsed||{};
  if(kind==='risk'){ const l=Math.min(5,Math.max(1,p.l||3)), i=Math.min(5,Math.max(1,p.i||3)); const sc=calcRisk(l,i);
    DB.risks.unshift({id:uid('RSK'),title:t,desc:desc,cat:p.cat||'Cyber',owner:owner,l:l,i:i,score:sc.score,level:sc.level,plan:'Treatment plan drafted from scanned document — review and update.',status:'Identified',created:date});
    logAction('Created risk "'+t+'" via document scan');
    if(sc.level==='Critical')notify('risk','Critical risk alert','"'+t+'" scored '+sc.score+' (Critical).'); }
  else if(kind==='incident'){ const sev=['Critical','High','Medium','Low'].indexOf(p.sev)>-1?p.sev:'Medium';
    DB.incidents.unshift({id:uid('INC'),title:t,cls:'Other',sev:sev,desc:desc,date:date,officer:owner,actions:'',notes:desc.slice(0,200),status:'Reported',resolvedDate:null,timeline:[{t:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),x:'Imported from scanned document by '+me().name}]});
    logAction('Created incident "'+t+'" via document scan');
    if(sev==='Critical'||sev==='High')notify('incident','New '+sev+' incident',t+' imported from scanned document.'); }
  else{ DB.policies.unshift({id:uid('POL'),name:t,desc:desc,owner:owner,status:'Draft',created:date,updated:today()});
    logAction('Created policy "'+t+'" via document scan'); }
  DB.documents.unshift({id:uid('DOC'),name:scanState.file?scanState.file.name:'scan-'+Date.now()+'.txt',cls:cls,src:'OCR Scan',date:today(),by:me().name,text:scanState.text});
  dbSave(); updateIncBadge(); toast('Record created & document saved to vault.'); renderDocs();
}
function docForm(){
  if(!canEdit()){ toast('Viewers cannot upload documents.','error'); return; }
  openModal('Upload Document',`
    <div><label>Document name *</label><input id="df-name" placeholder="e.g. Vendor Security Assessment — NovaPay.pdf"></div>
    <div><label>Classification</label><select id="df-cls">${['Confidential','Internal','Public'].map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div><label>Notes / summary</label><textarea id="df-notes" rows="3" placeholder="Short description of this document…"></textarea></div>
    <div class="p-3 rounded-lg text-xs" style="background:var(--card2);border:1px solid var(--border)">Demo vault stores metadata and a short text preview. In production, files would be encrypted at rest with KMS-managed keys and virus-scanned on upload.</div>`,()=>{
    const n=$('#df-name').value.trim(); if(!n){ toast('Document name is required.','error'); return false; }
    DB.documents.unshift({id:uid('DOC'),name:n,cls:$('#df-cls').value,src:'Manual upload',date:today(),by:me().name,text:$('#df-notes').value.trim()});
    logAction('Uploaded document "'+n+'" ('+$('#df-cls').value+')'); dbSave(); renderDocs(); toast('Document added to vault.'); });
}
function docView(id){ const d=DB.documents.find(x=>x.id===id); if(!d)return;
  openModal('Document · '+d.id,`<div class="p-4 rounded-xl border" style="border-color:var(--border);background:var(--card2)">
    <h4 class="font-extrabold mb-2 break-all">${esc(d.name)}</h4>
    <div class="grid grid-cols-2 gap-2 text-xs mb-3"><p><span class="muted">Class:</span> <b>${d.cls}</b></p><p><span class="muted">Source:</span> <b>${esc(d.src)}</b></p>
    <p><span class="muted">Uploaded:</span> <b>${fmtD(d.date)}</b></p><p><span class="muted">By:</span> <b>${esc(d.by)}</b></p></div>
    <p class="text-xs font-bold uppercase tracking-wide muted mb-1">Content preview</p>
    <pre class="mono text-[11px] whitespace-pre-wrap p-3 rounded-lg max-h-56 overflow-y-auto" style="background:var(--bg);border:1px solid var(--border)">${esc(d.text||'—')}</pre></div>`,null,'Close'); }
function docDel(id){ if(!requireRole(['Admin','Security Officer']))return; const d=DB.documents.find(x=>x.id===id);
  confirmDlg('Delete document "'+d.name+'" from the vault?',()=>{ DB.documents=DB.documents.filter(x=>x.id!==id); dbSave(); logAction('Deleted document '+d.name); toast('Document deleted.','info'); renderDocs(); }); }

/* ═════════ GLOBAL SEARCH ═════════ */
function globalSearch(q){
  const drop=$('#search-drop'); q=q.trim().toLowerCase();
  if(!q){ drop.classList.add('hidden'); return; }
  const hits=[
    ...DB.risks.filter(r=>r.title.toLowerCase().includes(q)||r.id.toLowerCase().includes(q)).map(r=>({icon:'alert-triangle',t:r.title,s:r.id+' · '+r.level,v:'risks'})),
    ...DB.policies.filter(p=>p.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)).map(p=>({icon:'scroll-text',t:p.name,s:p.id+' · '+p.status,v:'governance'})),
    ...DB.incidents.filter(i=>i.title.toLowerCase().includes(q)||i.id.toLowerCase().includes(q)).map(i=>({icon:'siren',t:i.title,s:i.id+' · '+i.status,v:'incidents'})),
    ...DB.audits.filter(a=>a.title.toLowerCase().includes(q)||a.id.toLowerCase().includes(q)).map(a=>({icon:'clipboard-check',t:a.title,s:a.id+' · '+a.status,v:'audits'})),
    ...DB.frameworks.filter(f=>f.name.toLowerCase().includes(q)).map(f=>({icon:'check-square',t:f.name,s:compPctOf(f)+'% compliant',v:'compliance'})),
    ...DB.documents.filter(d=>d.name.toLowerCase().includes(q)).map(d=>({icon:'scan-line',t:d.name,s:d.id+' · '+d.cls,v:'docs'})),
  ].slice(0,10);
  const inp=$('#global-search'); const r=inp.getBoundingClientRect();
  drop.style.top=(r.bottom+6)+'px'; drop.style.left=r.left+'px';
  drop.innerHTML=hits.length?hits.map((h,i)=>`<div class="px-4 py-2.5 flex items-center gap-3 cursor-pointer hover:bg-cyan-500/10 border-b last:border-0" style="border-color:var(--border)" onclick="go('${h.v}');$('#search-drop').classList.add('hidden');$('#global-search').value=''">
    <i data-lucide="${h.icon}" class="w-4 h-4 text-cy shrink-0"></i><div class="min-w-0"><b class="text-sm truncate block">${esc(h.t)}</b><span class="text-[11px] muted">${esc(h.s)}</span></div></div>`).join('')
    :'<p class="p-4 text-sm muted">No results for "'+esc(q)+'".</p>';
  drop.classList.remove('hidden'); lucide.createIcons();
}
document.addEventListener('click',e=>{ if(!e.target.closest('#global-search')&&!e.target.closest('#search-drop')) $('#search-drop').classList.add('hidden'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); $('#search-drop').classList.add('hidden'); } if(e.key==='Enter'&&document.activeElement&&['li-email','li-pass'].includes(document.activeElement.id)) doLogin(); });

/* ═════════ BOOT ═════════ */
function boot(){
  dbLoad(); loadSession();
  applyTheme(localStorage.getItem('grcshield_theme')||'dark');
  const u=me();
  if(u&&u.active){ renderApp(); go('dashboard'); }
  else { if(u&&!u.active){ session=null; saveSession(); } renderLogin(); }
}
boot();
</script>
